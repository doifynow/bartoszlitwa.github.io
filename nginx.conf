server {
    listen 80;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/portfolio-security-headers.conf;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 256;

    location = /health {
        access_log off;
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        include /etc/nginx/portfolio-security-headers.conf;
        return 200 "healthy\n";
    }

    location / {
        # The portfolio uses hash anchors, so no application routes need an HTML fallback.
        try_files $uri $uri/ =404;
    }

    location = /index.html {
        # Preserve public contact links instead of allowing CDN email-link rewriting.
        add_header Cache-Control "no-cache, no-store, must-revalidate, no-transform" always;
        include /etc/nginx/portfolio-security-headers.conf;
    }

    location ~* \.(avif|css|eot|gif|glb|ico|jpe?g|js|png|svg|ttf|webp|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/portfolio-security-headers.conf;
    }
}
